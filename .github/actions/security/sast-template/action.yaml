name: 'Generic Security Scanner'
description: 'Runs a security tool via Docker and uploads SARIF report'
inputs:
  command:
    description: 'Command to execute inside the container'
    required: true
  report_file:
    description: 'Name of the output SARIF file'
    required: true
  tool_name:
    description: 'Name of the tool'
    required: true
  image: 
    description: 'Docker image to use'
    required: true
  dojo_scan_type:
    description: 'Dojo Scan Type'
    required: true
  defectdojo_url:
    description: 'DefectDojo URL'
    required: true
  defectdojo_token:
    description: 'DefectDojo API Token'
    required: true
  defectdojo_product_name:
    description: 'DefectDojo Product Name'
    required: true

runs:
  using: "composite"
  steps:

    - name: Run Analysis Tool (${{ inputs.tool_name }})
      shell: bash
      continue-on-error: true
      run: |
        echo "Running ${{ inputs.tool_name }}"
        
        docker run --rm --entrypoint "" \
          -v "${{ github.workspace }}:/code" \
          -w /code \
          ${{ inputs.image }} \
          ${{ inputs.command }}
          
        echo "::endgroup::"

    # - name: Upload SARIF to GitHub Security
    #   uses: github/codeql-action/upload-sarif@v4
    #   if: always()
    #   with:
    #     sarif_file: ${{ inputs.report_file }}
    #     category: ${{ inputs.tool_name }}

    - name: Upload to DefectDojo
      if: always()
      uses: gha-sec-scans/orchestrator/.github/actions/utils/defectdojo-upload@feature/refinement
      with:
        defectdojo_url: ${{ inputs.defectdojo_url }}
        defectdojo_token: ${{ inputs.defectdojo_token }}
        report_file: ${{ inputs.report_file }} 
        scan_type: ${{ inputs.dojo_scan_type }}
        engagement_name: ${{ inputs.tool_name }}
        product_name: ${{ inputs.defectdojo_product_name }}