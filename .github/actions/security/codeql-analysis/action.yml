name: 'CodeQL Analysis'
description: 'Runs GitHub CodeQL SAST'
inputs:
  project-type:
    description: 'maven or node'
    required: true
  defectdojo_url:
    description: 'DefectDojo URL'
    required: true
  defectdojo_token:
    description: 'DefectDojo API Token'
    required: true
  defectdojo_product_name:
    description: 'DefectDojo Product Name'
    required: true

runs:
  using: "composite"
  steps:
    - name: Init CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ inputs.project-type == 'maven' && 'java' || 'javascript' }}
        build-mode: ${{ inputs.project-type == 'maven' && 'manual' || 'none' }}

    - name: Build for CodeQL (Java)
      if: inputs.project-type == 'maven'
      shell: bash
      run: mvn clean package -DskipTests -B

    - name: Analyze CodeQL
      uses: github/codeql-action/analyze@v4
      with:
        output: ${{ github.workspace }}/codeql-results
      continue-on-error: true

    - name: Prepare CodeQL SARIF report
      if: always()
      shell: bash
      run: |
        set +e
        mkdir -p codeql-results
        SARIF_FILE=$(find "${{ github.workspace }}" "${{ runner.temp }}" -name "*.sarif" 2>/dev/null | head -n 1)
        if [ -n "$SARIF_FILE" ] && [ -f "$SARIF_FILE" ]; then
          echo "Found SARIF report: $SARIF_FILE"
          cp "$SARIF_FILE" codeql-report.sarif
        else
          echo "No SARIF file found"
        fi
        exit 0

    - name: Upload CodeQL to DefectDojo
      if: always() && hashFiles('codeql-report.sarif') != ''
      uses: gha-sec-scans/orchestrator/.github/actions/utils/defectdojo-upload@feature/refinement
      with:
        defectdojo_url: ${{ inputs.defectdojo_url }}
        defectdojo_token: ${{ inputs.defectdojo_token }}
        report_file: "codeql-report.sarif"
        scan_type: "SARIF"
        engagement_name: "CodeQL"
        product_name: ${{ inputs.defectdojo_product_name }}