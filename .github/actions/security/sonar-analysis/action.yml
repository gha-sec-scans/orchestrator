name: 'SonarCloud Analysis & DefectDojo Sync'
description: 'Runs SonarCloud Scan and uploads results to DefectDojo'
inputs:
  project-type:
    description: 'maven or node'
    required: true
  sonar-token:
    description: 'Sonar Token'
    required: true
  github-token:
    description: 'GitHub Token'
    required: true
  defectdojo_url:
    description: 'DefectDojo URL'
    required: true
  defectdojo_token:
    description: 'DefectDojo API Token'
    required: true
  defectdojo_product_name:
    description: 'DefectDojo Product Name'
    required: true
  sonar-organization:
    description: 'SonarCloud Organization'
    required: true
  sonar-project-key:
    description: 'SonarCloud Project Key'
    required: true

runs:
  using: "composite"
  steps:
    - name: Sonar Analysis (Maven)
      if: inputs.project-type == 'maven'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
        -Dsonar.organization=${{ inputs.sonar-organization }} \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.qualitygate.wait=true 

    - name: Sonar Analysis (Node)
      if: inputs.project-type == 'node'
      continue-on-error: true
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      with:
        args: >
          -Dsonar.organization=${{ inputs.sonar-organization }}
          -Dsonar.projectKey=${{ inputs.sonar-project-key }}
          -Dsonar.qualitygate.wait=true 

    - name: Pull from SonarCloud & Push to DefectDojo
      shell: bash
      run: |
        echo "Downloading SonarCloud report..."
        curl -s -u "${{ inputs.sonar-token }}:" "https://sonarcloud.io/api/issues/search?projects=${{ inputs.sonar-project-key }}&ps=500" -o sonar-report.json
        npm install -g sonar-report
        sonar-report \
          --sonarurl="https://sonarcloud.io" \
          --sonarcomponent="${{ inputs.sonar-project-key }}" \
          --sonarorganization="${{ inputs.sonar-organization }}" \
          --project="${{ inputs.sonar-project-key }}" \
          --application="${{ inputs.sonar-project-key }}" \
          --sonartoken="${{ inputs.sonar-token }}" \
          --output="sonar-report.html"

    - name: Upload to DefectDojo
      if: always()
      uses: gha-sec-scans/orchestrator/.github/actions/utils/defectdojo-upload@main
      with:
        defectdojo_url: ${{ inputs.defectdojo_url }}
        defectdojo_token: ${{ inputs.defectdojo_token }}
        report_file: 'sonar-report.json'              
        scan_type: 'SonarQube Scan'                   
        engagement_name: 'SonarCloud'  
        product_name: ${{ inputs.defectdojo_product_name }}
