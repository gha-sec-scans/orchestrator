name: 'Smart Setup & Cache'
description: 'Detects tech stack, installs dependencies and handles caching'
inputs:
  node-version:
    description: 'Node version'
    default: '18'
    required: false
  java-version:
    description: 'JDK Version'
    default: '25'
    required: false

outputs:
  project-type:
    description: "Detected project type (maven or node)"
    value: ${{ steps.detect.outputs.type }}

runs:
  using: "composite"
  steps:
    - name: Detect type of project
      id: detect
      shell: bash
      run: |
        if [ -f "pom.xml" ]; then
          echo "type=maven" >> $GITHUB_OUTPUT
          echo "::notice::Detected Maven Project"
        elif [ -f "package.json" ]; then
          echo "type=node" >> $GITHUB_OUTPUT
          echo "::notice::Detected Node Project"
          
          if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
            echo "node-cache=npm" >> $GITHUB_OUTPUT
            echo "install-cmd=npm ci --prefer-offline" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "node-cache=yarn" >> $GITHUB_OUTPUT
            echo "install-cmd=yarn install --prefer-offline" >> $GITHUB_OUTPUT
          else
            echo "node-cache=" >> $GITHUB_OUTPUT
            echo "install-cmd=npm install --prefer-offline" >> $GITHUB_OUTPUT
          fi
        else
          echo "::error::No valid project file found (pom.xml/package.json)"
          exit 1
        fi

    # NODE SETUP
    - name: Setup Node
      if: steps.detect.outputs.type == 'node'
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.detect.outputs.node-cache }}

    - name: Install Node Dependencies
      if: steps.detect.outputs.type == 'node'
      shell: bash
      run: ${{ steps.detect.outputs.install-cmd }}

    # MAVEN SETUP
    - name: Setup Java
      if: steps.detect.outputs.type == 'maven'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}
        cache: 'maven'

    - name: Resolve Maven Dependencies
      if: steps.detect.outputs.type == 'maven'
      shell: bash
      run: mvn dependency:resolve-plugins dependency:go-offline -B