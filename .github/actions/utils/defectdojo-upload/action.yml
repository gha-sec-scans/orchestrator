name: 'Upload to DefectDojo'
description: 'Upload scan results to DefectDojo via Reimport API'
inputs:
  defectdojo_url:
    description: 'DefectDojo URL'
    required: true
  defectdojo_token:
    description: 'DefectDojo API Token'
    required: true
  report_file:
    description: 'File to upload'
    required: true
  scan_type:
    description: 'Scan type in DefectDojo (e.g., Trivy Scan)'
    required: true
  engagement_name:
    description: 'Name of the Engagement / Box'
    required: true
  product_name:
    description: 'Name of the Product in DefectDojo'
    required: true
  product_type_name:
    description: 'Product type name in DefectDojo (for auto-creating products)'
    required: false
    default: 'Research and Development'

runs:
  using: "composite"
  steps:
    - name: Reimport Scan to DefectDojo
      shell: bash
      run: |
        echo "Enviando ${{ inputs.report_file }} (Tipo: ${{ inputs.scan_type }}) a DefectDojo..."
        curl -X POST "${{ inputs.defectdojo_url }}/api/v2/reimport-scan/" \
             -H "Authorization: Token ${{ inputs.defectdojo_token }}" \
             -H "Content-Type: multipart/form-data" \
             -F "active=true" \
             -F "verified=true" \
             -F "scan_type=${{ inputs.scan_type }}" \
             -F "minimum_severity=Info" \
             -F "engagement_name=${{ inputs.engagement_name }}" \
             -F "product_name=${{ inputs.product_name }}" \
             -F "product_type_name=${{ inputs.product_type_name }}" \
             -F "file=@${{ inputs.report_file }}" \
             -F "auto_create_context=true" \
             -F "close_old_findings=true"